experiment:
  name: 02_smallcnn_scratch
  notes: 8-conv VGG-style net with BN + GAP, trained from random initialisation.
  seed: 0
  config_path: configs/02_smallcnn_scratch.yaml
data:
  root: data
  train_dir: train
  test_dir: test
  val_fraction: 0.2
  split: stratified
  batch_size: 64
  num_workers: 4
  img_size: 128
  grayscale: false
  mean:
  - 0.485
  - 0.456
  - 0.406
  std:
  - 0.229
  - 0.224
  - 0.225
augment:
  preset: basic
  random_resized_crop: true
  crop_scale:
  - 0.65
  - 1.0
  hflip: 0.5
  rand_augment:
    enabled: false
    num_ops: 2
    magnitude: 9
  color_jitter: 0.0
  random_erasing: 0.0
  mixup_alpha: 0.0
  cutmix_alpha: 0.0
  mix_prob: 0.5
model:
  name: smallcnn
  pretrained: false
  dropout: 0.2
  freeze: none
optim:
  optimizer: adamw
  lr: 0.001
  head_lr_mult: 1.0
  weight_decay: 0.01
  momentum: 0.9
  nesterov: true
  scheduler: cosine
  warmup_epochs: 3
  min_lr: 1.0e-06
  epochs: 60
  grad_clip: 1.0
  label_smoothing: 0.0
  amp: true
  ema:
    enabled: false
    decay: 0.999
  early_stopping_patience: 0
eval:
  tta: none
  monitor: val_acc
output:
  root: runs
  save_best: true
  save_last: false
