experiment:
  name: 07_resnet50_mixup
  notes: Adds mixup 0.2 / cutmix 1.0 to the experiment 6 recipe.
  seed: 0
  config_path: configs/07_resnet50_mixup.yaml
data:
  root: data
  train_dir: train
  test_dir: test
  val_fraction: 0.2
  split: stratified
  batch_size: 32
  num_workers: 4
  img_size: 224
  grayscale: false
  mean:
  - 0.485
  - 0.456
  - 0.406
  std:
  - 0.229
  - 0.224
  - 0.225
augment:
  preset: strong
  random_resized_crop: true
  crop_scale:
  - 0.65
  - 1.0
  hflip: 0.5
  rand_augment:
    enabled: false
    num_ops: 2
    magnitude: 9
  color_jitter: 0.0
  random_erasing: 0.0
  mixup_alpha: 0.2
  cutmix_alpha: 1.0
  mix_prob: 0.5
model:
  name: resnet50
  pretrained: true
  dropout: 0.0
  freeze: none
optim:
  optimizer: adamw
  lr: 0.0003
  head_lr_mult: 10.0
  weight_decay: 0.05
  momentum: 0.9
  nesterov: true
  scheduler: cosine
  warmup_epochs: 3
  min_lr: 1.0e-06
  epochs: 60
  grad_clip: 1.0
  label_smoothing: 0.1
  amp: true
  ema:
    enabled: false
    decay: 0.999
  early_stopping_patience: 0
eval:
  tta: none
  monitor: val_acc
output:
  root: runs
  save_best: true
  save_last: false
