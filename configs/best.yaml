# FINAL RECIPE - reproduces the submitted checkpoint and the reported test accuracy.
#
# Identical to configs/05_resnet50_finetune.yaml, restated in full so this file is
# self-contained. That experiment was the best *completed* run on validation
# (95.21%) and is the model scored on the test set (94.25%).
#
# Why each element is here, with the measured justification from README.md:
#
#   resnet50 + ImageNet-1k weights, freeze: none - pretraining is worth ~32 pp on
#     its own (experiment 3, a frozen backbone with an 8,208-parameter head reaches
#     91.04%). Fine-tuning adds 3.4 pp (experiment 4) and ResNet-50 over ResNet-18
#     adds 0.63 pp (experiment 5), which is only just outside the noise floor.
#   224 px colour input - the starter's grayscale 64x64 discards colour and spatial
#     detail; restoring it gains 8.8 pp on the starter's own architecture
#     (experiment 1) before any change of model.
#   augment.preset: basic - RandomResizedCrop plus horizontal flip only. The strong
#     preset (RandAugment, colour jitter, RandomErasing) was tested in experiment 6
#     and cost 0.83 pp; see the failure analysis in README.md.
#   discriminative LR (backbone 3e-4, head 10x) - the head starts from noise and
#     must move quickly; the pretrained filters must be protected.
#   cosine schedule + 2 warmup epochs, stepped per batch - warmup keeps the
#     untrained head's early gradients from damaging the backbone.
#   label smoothing 0.1 - mild calibration gain, cheap and consistent.
#   ema.enabled: false, eval.tta: none - both are implemented and were exercised,
#     but the selected checkpoint used neither; where EMA was enabled the plain
#     weights were selected anyway, so they are not included for appearance.
#   model selection on validation accuracy only, among completed runs. The test set
#     was scored once, on the already-chosen checkpoint.
experiment:
  name: best
  notes: Final submitted recipe. ResNet-50, ImageNet-1k pretrained, fully fine-tuned.
  seed: 0

data:
  root: data
  img_size: 224
  grayscale: false
  split: stratified
  val_fraction: 0.20
  batch_size: 32
  num_workers: 4
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

augment:
  preset: basic
  crop_scale: [0.65, 1.0]
  hflip: 0.5
  mixup_alpha: 0.0
  cutmix_alpha: 0.0

model:
  name: resnet50
  pretrained: true
  freeze: none
  dropout: 0.0

optim:
  optimizer: adamw
  lr: 0.0003
  head_lr_mult: 10.0
  weight_decay: 0.05
  scheduler: cosine
  warmup_epochs: 2
  min_lr: 1.0e-6
  epochs: 30
  grad_clip: 1.0
  label_smoothing: 0.1
  amp: true
  ema:
    enabled: false
    decay: 0.999

eval:
  tta: none
  monitor: val_acc

output:
  root: runs
  save_best: true
